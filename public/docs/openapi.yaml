openapi: 3.0.3
info:
  title: My Store API
  version: 1.0.0
  description: |
    Dokumentasi OpenAPI untuk backend Laravel e-commerce sepatu My Store.
    Semua endpoint menggunakan prefix `/api/v1`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel server
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Categories
  - name: Brands
  - name: Products
  - name: Product Images
  - name: Product Variants
  - name: Cart
  - name: Wishlist
  - name: Addresses
  - name: Checkout
  - name: Orders
  - name: Admin Orders
paths:
  /register:
    post:
      tags: [Auth]
      security: []
      summary: Register customer baru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Register success, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /login:
    post:
      tags: [Auth]
      security: []
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Login success, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /logout:
    post:
      tags: [Auth]
      summary: Logout user yang sedang login
      responses:
        '200': { $ref: '#/components/responses/SuccessNull' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /profile:
    get:
      tags: [Auth]
      summary: Ambil profil user login
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /categories:
    get:
      tags: [Categories]
      security: []
      summary: List kategori dengan pagination dan search
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortOldestLatest'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PaginatedResponse' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } ] } } } }
    post:
      tags: [Categories]
      summary: Tambah kategori
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/Category' } } } ] } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /categories/{category}:
    parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
    get:
      tags: [Categories]
      security: []
      summary: Detail kategori
      responses: { '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/Category' } } } ] } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Categories]
      summary: Update kategori
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameRequest' } } } }
      responses: { '200': { description: Updated }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Categories]
      summary: Hapus kategori
      responses: { '200': { $ref: '#/components/responses/SuccessNull' } }

  /brands:
    get:
      tags: [Brands]
      security: []
      summary: List brand dengan pagination dan search
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortOldestLatest'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PaginatedResponse' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Brand' } } } } ] } } } }
    post:
      tags: [Brands]
      summary: Tambah brand
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameRequest' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /brands/{brand}:
    parameters: [ { $ref: '#/components/parameters/BrandId' } ]
    get: { tags: [Brands], security: [], summary: Detail brand, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Brands], summary: Update brand, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameRequest' } } } }, responses: { '200': { description: Updated }, '422': { $ref: '#/components/responses/ValidationError' } } }
    delete: { tags: [Brands], summary: Hapus brand, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }

  /products:
    get:
      tags: [Products]
      security: []
      summary: List produk dengan search, filter, sorting, dan pagination
      parameters:
        - $ref: '#/components/parameters/Search'
        - { name: category, in: query, schema: { type: string }, description: Filter slug kategori }
        - { name: brand, in: query, schema: { type: string }, description: Filter slug brand }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: is_new, in: query, schema: { type: boolean } }
        - { name: is_trending, in: query, schema: { type: boolean } }
        - { name: is_best_seller, in: query, schema: { type: boolean } }
        - { name: active_only, in: query, schema: { type: boolean, default: true } }
        - { name: sort, in: query, schema: { type: string, enum: [latest, oldest, low-price, high-price] } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/PaginatedResponse' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Product' } } } } ] } } } }
    post:
      tags: [Products]
      summary: Tambah produk
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /products/{product}:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get: { tags: [Products], security: [], summary: Detail produk, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }
    put: { tags: [Products], summary: Update produk, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }, responses: { '200': { description: Updated }, '422': { $ref: '#/components/responses/ValidationError' } } }
    delete: { tags: [Products], summary: Hapus produk, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }

  /products/{product}/images:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get: { tags: [Product Images], security: [], summary: List gambar produk, responses: { '200': { description: OK } } }
    post: { tags: [Product Images], summary: Tambah gambar produk, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductImageRequest' } } } }, responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /products/{product}/images/{image}:
    parameters: [ { $ref: '#/components/parameters/ProductId' }, { name: image, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [Product Images], security: [], summary: Detail gambar produk, responses: { '200': { description: OK } } }
    put: { tags: [Product Images], summary: Update gambar produk, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductImageRequest' } } } }, responses: { '200': { description: Updated } } }
    delete: { tags: [Product Images], summary: Hapus gambar produk, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }
  /products/{product}/variants:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get: { tags: [Product Variants], security: [], summary: List varian produk, responses: { '200': { description: OK } } }
    post: { tags: [Product Variants], summary: Tambah varian produk, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductVariantRequest' } } } }, responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /products/{product}/variants/{variant}:
    parameters: [ { $ref: '#/components/parameters/ProductId' }, { name: variant, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [Product Variants], security: [], summary: Detail varian produk, responses: { '200': { description: OK } } }
    put: { tags: [Product Variants], summary: Update varian produk, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductVariantRequest' } } } }, responses: { '200': { description: Updated } } }
    delete: { tags: [Product Variants], summary: Hapus varian produk, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }

  /cart:
    get: { tags: [Cart], summary: List cart user login, responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthenticated' } } }
    post:
      tags: [Cart]
      summary: Tambah produk ke cart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartRequest' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete: { tags: [Cart], summary: Kosongkan cart, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }
  /cart/{cart}:
    parameters: [ { name: cart, in: path, required: true, schema: { type: integer } } ]
    put: { tags: [Cart], summary: Update quantity cart, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1 } } } } } }, responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' } } }
    delete: { tags: [Cart], summary: Hapus item cart, responses: { '200': { $ref: '#/components/responses/SuccessNull' }, '403': { $ref: '#/components/responses/Forbidden' } } }

  /wishlist:
    get: { tags: [Wishlist], summary: List wishlist user login, responses: { '200': { description: OK } } }
    post: { tags: [Wishlist], summary: Tambah wishlist, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_id], properties: { product_id: { type: integer } } } } } }, responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /wishlist/{wishlist}:
    parameters: [ { name: wishlist, in: path, required: true, schema: { type: integer } } ]
    delete: { tags: [Wishlist], summary: Hapus wishlist by id, responses: { '200': { $ref: '#/components/responses/SuccessNull' }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /wishlist/product/{product}:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    delete: { tags: [Wishlist], summary: Hapus wishlist berdasarkan product id, responses: { '200': { $ref: '#/components/responses/SuccessNull' } } }

  /addresses:
    get: { tags: [Addresses], summary: List alamat user login, responses: { '200': { description: OK } } }
    post: { tags: [Addresses], summary: Tambah alamat, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }, responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /addresses/{address}:
    parameters: [ { name: address, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [Addresses], summary: Detail alamat, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
    put: { tags: [Addresses], summary: Update alamat, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }, responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' } } }
    delete: { tags: [Addresses], summary: Hapus alamat, responses: { '200': { $ref: '#/components/responses/SuccessNull' }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /addresses/{address}/default:
    parameters: [ { name: address, in: path, required: true, schema: { type: integer } } ]
    patch: { tags: [Addresses], summary: Jadikan alamat default, responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' } } }

  /checkout:
    post:
      tags: [Checkout]
      summary: Checkout cart menjadi order
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutRequest' } } } }
      responses: { '201': { description: Order created }, '400': { description: Cart empty / stock tidak cukup }, '422': { $ref: '#/components/responses/ValidationError' } }
  /orders:
    get:
      tags: [Orders]
      summary: List order user login
      parameters:
        - { name: order_status, in: query, schema: { type: string, enum: [pending, processing, shipped, completed, cancelled] } }
        - { name: payment_status, in: query, schema: { type: string, enum: [pending, paid, failed, expired, refunded] } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses: { '200': { description: OK } }
  /orders/{order}:
    parameters: [ { name: order, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [Orders], summary: Detail order user login, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }

  /admin/orders:
    get:
      tags: [Admin Orders]
      summary: Admin list semua order
      parameters:
        - $ref: '#/components/parameters/Search'
        - { name: order_status, in: query, schema: { type: string, enum: [pending, processing, shipped, completed, cancelled] } }
        - { name: payment_status, in: query, schema: { type: string, enum: [pending, paid, failed, expired, refunded] } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/orders/{order}:
    parameters: [ { name: order, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [Admin Orders], summary: Admin detail order, responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/orders/{order}/status:
    parameters: [ { name: order, in: path, required: true, schema: { type: integer } } ]
    patch:
      tags: [Admin Orders]
      summary: Admin update order_status
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [order_status], properties: { order_status: { type: string, enum: [pending, processing, shipped, completed, cancelled] } } } } } }
      responses: { '200': { description: Updated }, '422': { $ref: '#/components/responses/ValidationError' } }
  /admin/orders/{order}/payment-status:
    parameters: [ { name: order, in: path, required: true, schema: { type: integer } } ]
    patch:
      tags: [Admin Orders]
      summary: Admin update payment_status
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [payment_status], properties: { payment_status: { type: string, enum: [pending, paid, failed, expired, refunded] } } } } } }
      responses: { '200': { description: Updated }, '422': { $ref: '#/components/responses/ValidationError' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
  parameters:
    Search: { name: search, in: query, schema: { type: string }, description: Keyword pencarian }
    SortOldestLatest: { name: sort, in: query, schema: { type: string, enum: [latest, oldest] } }
    PerPage: { name: per_page, in: query, schema: { type: integer, default: 10, maximum: 50 } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    CategoryId: { name: category, in: path, required: true, schema: { type: integer } }
    BrandId: { name: brand, in: path, required: true, schema: { type: integer } }
    ProductId: { name: product, in: path, required: true, schema: { type: integer } }
  responses:
    SuccessNull:
      description: Success tanpa data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessNullResponse' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Token tidak valid / belum login
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Tidak punya akses
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Success }
        data: {}
    SuccessNullResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Deleted successfully }
        data: { nullable: true, example: null }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Error }
    ValidationErrorResponse:
      type: object
      properties:
        message: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }
        links: { type: object, nullable: true }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, example: Rian Rahman }
        email: { type: string, format: email, example: rian@example.com }
        password: { type: string, minLength: 8, example: password123 }
        password_confirmation: { type: string, example: password123 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: rian@example.com }
        password: { type: string, example: password123 }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                token_type: { type: string, example: Bearer }
                user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [customer, admin] }
        created_at: { type: string, format: date-time }
    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    ProductRequest:
      type: object
      required: [category_id, brand_id, name, sku, price]
      properties:
        category_id: { type: integer }
        brand_id: { type: integer }
        name: { type: string, maxLength: 255 }
        sku: { type: string, maxLength: 255 }
        price: { type: number, minimum: 0 }
        original_price: { type: number, nullable: true, minimum: 0 }
        description: { type: string, nullable: true }
        is_new: { type: boolean, default: false }
        is_trending: { type: boolean, default: false }
        is_best_seller: { type: boolean, default: false }
        is_active: { type: boolean, default: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductRequest'
        - type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            brand: { $ref: '#/components/schemas/Brand' }
            category: { $ref: '#/components/schemas/Category' }
            image: { type: string, nullable: true }
            images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
            variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
            sizes: { type: array, items: { type: string } }
            colors: { type: array, items: { type: string } }
    ProductImageRequest:
      type: object
      required: [image]
      properties:
        image: { type: string, example: products/nike.jpg }
        is_main: { type: boolean, default: false }
    ProductImage:
      allOf:
        - $ref: '#/components/schemas/ProductImageRequest'
        - type: object
          properties:
            id: { type: integer }
            product_id: { type: integer }
    ProductVariantRequest:
      type: object
      required: [size, color, stock]
      properties:
        size: { type: string, maxLength: 20, example: '42' }
        color: { type: string, maxLength: 100, example: Black }
        stock: { type: integer, minimum: 0, example: 10 }
    ProductVariant:
      allOf:
        - $ref: '#/components/schemas/ProductVariantRequest'
        - type: object
          properties:
            id: { type: integer }
            product_id: { type: integer }
    CartRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer }
        product_variant_id: { type: integer, nullable: true }
        quantity: { type: integer, minimum: 1 }
    AddressRequest:
      type: object
      required: [receiver_name, phone, address, province, city]
      properties:
        label: { type: string, nullable: true, maxLength: 100, example: Rumah }
        receiver_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 30 }
        address: { type: string }
        province: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        district: { type: string, nullable: true, maxLength: 255 }
        postal_code: { type: string, nullable: true, maxLength: 20 }
        is_default: { type: boolean, default: false }
    CheckoutRequest:
      type: object
      required: [address_id, payment_method]
      properties:
        address_id: { type: integer }
        payment_method: { type: string, maxLength: 100, example: bank_transfer }
        note: { type: string, nullable: true }
